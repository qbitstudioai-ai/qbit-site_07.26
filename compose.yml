# Запуск сайта Allqbit на сервере.
#
# Раскладка на сервере намеренно разделена на две части:
#
#   /opt/allqbit        — клон репозитория. Полностью перезаписывается при каждом деплое.
#   /opt/allqbit-data   — база, загруженные файлы и секреты. Деплой её не касается.
#
# Разделение обязательно: если бы `var/` лежал внутри каталога развёртывания, любое обновление
# кода стирало бы тексты и документы, введённые через админ-панель.

services:
  allqbit-site:
    build: .
    image: allqbit-site:latest

    # Имя фиксировано: по нему сайт находит Caddy. В /opt/supabase/volumes/proxy/caddy/Caddyfile
    # блок домена написан как `reverse_proxy allqbit-site:3000`. Переименуете — домен отвалится.
    container_name: allqbit-site

    restart: unless-stopped

    # Тот же UID, что и у пользователя nextjs в образе. Каталог данных на хосте принадлежит ему же
    # (deploy.sh это выставляет), иначе SQLite не сможет писать в базу.
    user: "1001:1001"

    # Секреты живут только на сервере и в git не попадают. Файл создаётся один раз вручную по
    # образцу .env.production.example.
    env_file:
      - /opt/allqbit-data/production.env

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      QBIT_DATA_DIR: /data
      # Приложение стоит за Caddy и напрямую из интернета недоступно, поэтому X-Forwarded-For
      # можно верить. Код берёт ПОСЛЕДНИЙ элемент цепочки, а Caddy дописывает реальный адрес
      # клиента в конец — счётчик попыток входа считает по адресу, как и задумано.
      # Если контейнер когда-нибудь начнут публиковать портом наружу — эту строку надо убрать.
      TRUST_PROXY: "1"

    volumes:
      # База контента и загруженные документы. Единственное, что переживает пересоздание образа.
      - /opt/allqbit-data/var:/data

    # Портов наружу нет намеренно: сайт доступен только изнутри docker-сети, снаружи — через Caddy
    # по HTTPS. Так выполняется требование «прямой доступ к порту приложения закрыт».
    networks:
      - supabase_default

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Сеть создана стеком Supabase; в ней же живёт Caddy, который принимает 80 и 443.
  supabase_default:
    external: true
